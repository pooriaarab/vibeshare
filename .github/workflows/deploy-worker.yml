name: Deploy signaling Worker

# Mirrors the npm branch model: main -> staging, release -> production.
on:
  push:
    branches: [main, release]
    paths:
      - 'worker/**'
      - 'src/webrtc/viewerPage.ts' # the Worker bundles the viewer page
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on token presence
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping Worker deploy. Add the secret to enable auto-deploy."
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.have == 'true'
        with:
          node-version: '20'
      - name: Install worker deps
        if: steps.gate.outputs.have == 'true'
        # --legacy-peer-deps: wrangler's peerOptional @cloudflare/workers-types@^4
        # conflicts with our devDep @^5; the mismatch is types-only and harmless.
        run: npm install --legacy-peer-deps
        working-directory: worker
      # Use the worker's own wrangler@4 (installed above with --legacy-peer-deps),
      # not cloudflare/wrangler-action — the action runs its own npm install
      # WITHOUT --legacy-peer-deps and ERESOLVEs on the workers-types@5 peer.
      - name: Deploy staging (main)
        if: steps.gate.outputs.have == 'true' && github.ref == 'refs/heads/main'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Deploy production (release)
        if: steps.gate.outputs.have == 'true' && github.ref == 'refs/heads/release'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

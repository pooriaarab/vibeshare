name = "vibeshare-signaling"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# One Durable Object per shareId does per-share fan-out.
[[durable_objects.bindings]]
name = "SHARES"
class_name = "ShareRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareRoom"]

